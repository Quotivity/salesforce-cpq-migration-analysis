    <path d="M 500 350 C 542 420 548 492 532 532 C 480 534 418 516 382 490 C 440 470 480 420 500 350 Z" fill="#FFFFFF"/>
    <line x1="352" y1="318" x2="528" y2="494" stroke="#0BAE7C" stroke-width="18" stroke-linecap="round"/>
