name: Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (patch, minor, major, or an explicit x.y.z)
        required: true
        default: patch

permissions:
  contents: write

jobs:
  bump:
    name: Bump every workspace, commit and tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bump
        run: npm run version:sync -- "${{ github.event.inputs.bump }}"
      - name: Commit and tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD
          git push origin "v${VERSION}"
