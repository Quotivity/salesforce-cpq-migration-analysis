name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Verify and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag must match the workspace version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version ${VERSION}"; exit 1; }
          for pkg in packages/core packages/plugin; do
            PV=$(node -p "require('./${pkg}/package.json').version")
            test "${PV}" = "${VERSION}" || { echo "${pkg} is at ${PV}, expected ${VERSION}"; exit 1; }
          done
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check
      # npm trusted publishing: the job's OIDC token authenticates the publish, so there is no
      # long-lived token and nothing that bypasses 2FA. Needs npm 11.5.1+ and, on npmjs.com, a
      # trusted publisher on each package pointing at this repository and workflow file.
      # packages/standalone is private for now and is not published.
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@latest && npm --version
      - name: Publish core
        run: npm publish --workspace packages/core --access public
      - name: Publish plugin
        run: npm publish --workspace packages/plugin --access public
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
